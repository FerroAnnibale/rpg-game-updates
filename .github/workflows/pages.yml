name: Publish game updates

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out update repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Download published game files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/game-site" site
          if [ -n "$RELEASE_TAG" ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern game-site.zip --dir "$RUNNER_TEMP/game-site"
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern game-site.zip --dir "$RUNNER_TEMP/game-site"
          fi
          unzip -q "$RUNNER_TEMP/game-site/game-site.zip" -d site
          VERSION=$(python -c 'import json; print(json.load(open("site/update-manifest.json"))["version"])')
          echo "Publishing game version ${VERSION} from release tag ${RELEASE_TAG:-latest}"
          sed -E -i "s#src=\"js/plugins\\.js(\\?v=[^\"]*)?\"#src=\"js/plugins.js?v=${VERSION}\"#" site/index.html
          python -c 'import hashlib, json, pathlib; root=pathlib.Path("site"); manifest_path=root/"update-manifest.json"; manifest=json.loads(manifest_path.read_text(encoding="utf-8")); content=(root/"index.html").read_bytes(); entry=next(item for item in manifest["files"] if item["path"]=="index.html"); entry["size"]=len(content); entry["sha256"]=hashlib.sha256(content).hexdigest(); manifest_path.write_text(json.dumps(manifest, indent=2)+"\n", encoding="utf-8")'
          test -f site/index.html
          test -f site/update-manifest.json
          grep -q "js/plugins.js?v=${VERSION}" site/index.html
      - name: Upload game website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish game website
        id: deployment
        uses: actions/deploy-pages@v4
